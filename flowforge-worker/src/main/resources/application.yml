spring:
  application:
    name: flowforge-worker
  data:
    redis:
      host: localhost
      port: 6380
      timeout: 500ms           # fail fast: Redis is an optimization, never a blocker
      connect-timeout: 500ms
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5
    consumer:
      group-id: flowforge-workers
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 500
      properties:
        session.timeout.ms: 6000
        heartbeat.interval.ms: 500
    listener:
      concurrency: 12   # one consumer thread per partition

flowforge:
  worker:
    max-in-flight: 1000

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true          # /actuator/health/liveness and /readiness for Kubernetes
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${FLOWFORGE_TRACE_SAMPLING:0.1}   # parent-based: a sampled workflow is traced end to end
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  otlp:
    metrics:
      export:
        enabled: false   # metrics go to Prometheus; Jaeger only accepts traces
