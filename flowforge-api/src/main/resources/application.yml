spring:
  application:
    name: flowforge-api
  datasource:
    url: jdbc:postgresql://localhost:5433/flowforge
    username: flowforge
    password: flowforge
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # schema is owned by the orchestrator's Flyway migrations
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
  data:
    redis:
      host: localhost
      port: 6380
      timeout: 500ms           # fail fast: Redis is an optimization, never a blocker
      connect-timeout: 500ms
  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false

server:
  port: 8080

flowforge:
  security:
    jwt-secret: dev-only-secret-change-me-0123456789abcdef0123456789
    token-ttl: 1h
    users:
      - username: alice
        password: "{noop}alice-pass"
        scopes: [workflows:read, workflows:write]
      - username: bob
        password: "{noop}bob-pass"
        scopes: [workflows:read, workflows:write]
      - username: viewer
        password: "{noop}viewer-pass"
        scopes: [workflows:read]
      - username: admin
        password: "{noop}admin-pass"
        scopes: [workflows:read, workflows:write, workflows:admin]

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true          # /actuator/health/liveness and /readiness for Kubernetes
  metrics:
    tags:
      application: ${spring.application.name}
