apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app: api }
spec:
  replicas: 1   # local memory budget                       # stateless: any replica can serve any request (shared JWT secret)
  selector:
    matchLabels: { app: api }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /actuator/prometheus
    spec:
      terminationGracePeriodSeconds: 30
      # Pin host.docker.internal in /etc/hosts: no DNS dependency for reaching the out-of-cluster services.
      # (CoreDNS crashed under CPU starvation and pods failed to resolve the name at startup.)
      # 192.168.65.254 is Docker Desktop's host gateway; in the cloud these would be real endpoints (e.g. RDS).
      hostAliases:
        - ip: "192.168.65.254"
          hostnames: ["host.docker.internal"]
      containers:
        - name: api
          image: flowforge/api:dev
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: flowforge-config }
            - secretRef: { name: flowforge-secrets }
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://host.docker.internal:5433/flowforge
            # Mostly cached reads; see the connection budget in orchestrator.yaml.
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "5"
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 768Mi }   # OOMKilled at 640Mi
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 90
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: NodePort
  selector: { app: api }
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080               # kind maps this to http://localhost:8085 on the Mac
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: api }
